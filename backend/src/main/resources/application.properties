# Application Name & Port
spring.application.name=audition-vietphuc-remix
server.port=8080

# H2 Database Configuration (jdbc:h2:mem:auditiondb)
spring.datasource.url=jdbc:h2:mem:auditiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.8-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.max-retries=3
gemini.api.retry-backoff-ms=1000

# CORS Configuration for Frontend Integration
cors.allowed.origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000
